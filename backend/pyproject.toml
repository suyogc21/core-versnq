[project]
name = "versnq-core"
version = "0.1.0"
description = "Versnq Core — multi-tenant CRM backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "redis",
    "arq",
    "pyjwt>=2.15.1",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "pyotp>=2.10.0",
    "cryptography>=50.0.2",
    "phonenumbers>=9.0.43",
    "reportlab>=5.1.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
