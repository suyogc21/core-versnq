# Host nginx -> Versnq Core staff console. Installed by docs/DEPLOYMENT.md, then:
#   certbot --nginx -d admincore.versnq.in --redirect
server {
    listen 80;
    listen [::]:80;
    server_name admincore.versnq.in;
    client_max_body_size 12m;
    # browsers use HTTPS only for a year (go-live G-3); not includeSubDomains: other versnq.in sites
    add_header Strict-Transport-Security "max-age=31536000" always;

    # the staff API goes straight to the backend (one hop, so it sees the visitor's address)
    location /platform/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        # $remote_addr, not $proxy_add_x_forwarded_for: never pass on what the visitor sent
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
